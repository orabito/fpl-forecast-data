name: Update referees
on:
  schedule:
    # Thu-Mon, every 3 hours (UTC). GitHub may start runs a few minutes late.
    - cron: "15 */3 * * 0,1,4,5,6"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build referees.json
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python .github/workflows/scripts/update_referees.py
      - name: Commit
        run: |
          git config user.name "referee-bot"
          git config user.email "referee-bot@users.noreply.github.com"
          git add referees.json
          git commit -m "Update referees" || exit 0
          git push
