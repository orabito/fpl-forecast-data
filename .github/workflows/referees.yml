name: Update referees

on:
  schedule:
    - cron: "15 */3 * * 0,1,4,5,6"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/referees.yml"
      - "scripts/update_referees.py"

permissions:
  contents: write

concurrency:
  group: referees
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check files
        run: |
          pwd
          ls -la
          test -f scripts/update_referees.py || { echo "ERROR: scripts/update_referees.py is missing or in the wrong folder"; exit 1; }

      - name: Build referees.json
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python3 scripts/update_referees.py

      - name: Commit and push
        run: |
          git config user.name "referee-bot"
          git config user.email "referee-bot@users.noreply.github.com"
          git add referees.json
          if git diff --cached --quiet; then
            echo "No change to commit"
            exit 0
          fi
          git commit -m "Update referees"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
